server:
  port: 8222

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customer-service
              uri: lb://customer
              predicates:
                - Path=/api/v1/customers/**

            # === Маршрут для Fraud ===
            # - id: fraud-service
            #   uri: lb://fraud
            #   predicates:
            #     - Path=/api/v1/fraud-check/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
