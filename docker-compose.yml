services:
  postgres:
    container_name: postgres
    image: postgres
    environment:
      POSTGRES_USER: zim4ik
      POSTGRES_PASSWORD: password
      POSTGRES_DB: microservices
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - spring
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U zim4ik -d microservices" ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - spring
    restart: unless-stopped

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3.12-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - spring
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  zipkin:
    container_name: zipkin
    image: openzipkin/zipkin:3
    ports:
      - "9411:9411"
    networks:
      - spring
    restart: unless-stopped

  eureka-server:
    container_name: eureka-server
    profiles: [ "app" ]
    build:
      context: .
      args:
        MODULE: eureka-server
    image: zim4ik/eureka-server:latest
    ports:
      - "8761:8761"
    networks:
      - spring
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 12

  gateway:
    container_name: gateway
    profiles: [ "app" ]
    build:
      context: .
      args:
        MODULE: gateway
    image: zim4ik/gateway:latest
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    ports:
      - "8222:8222"
    networks:
      - spring
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8222/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: unless-stopped

  customer:
    container_name: customer
    profiles: [ "app" ]
    build:
      context: .
      args:
        MODULE: customer
    image: zim4ik/customer:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customer
      SPRING_RABBITMQ_HOST: rabbitmq
      EUREKA_URL: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    ports:
      - "8080:8080"
    networks:
      - spring
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: unless-stopped

  fraud:
    container_name: fraud
    profiles: [ "app" ]
    build:
      context: .
      args:
        MODULE: fraud
    image: zim4ik/fraud:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fraud
      EUREKA_URL: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    ports:
      - "8081:8081"
    networks:
      - spring
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8081/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: unless-stopped

  notification:
    container_name: notification
    profiles: [ "app" ]
    build:
      context: .
      args:
        MODULE: notification
    image: zim4ik/notification:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification
      SPRING_RABBITMQ_ADDRESSES: rabbitmq:5672
      EUREKA_URL: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    ports:
      - "8082:8082"
    networks:
      - spring
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8082/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: unless-stopped

networks:
  spring:
    driver: bridge

volumes:
  postgres:
  pgadmin:
