name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: mvn -B verify

      - name: Coverage summary
        if: always() && hashFiles('coverage-report/target/site/jacoco-aggregate/jacoco.csv') != ''
        run: python3 .github/scripts/coverage_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('coverage-report/target/site/jacoco-aggregate/jacoco.csv') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report/target/site/jacoco-aggregate

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Create .env
        run: cp .env.example .env

      - name: Build images
        run: docker compose --profile app build
